# Stage 6B frontend nginx configuration (Task 3).
#
# Deployed as /etc/nginx/conf.d/default.conf (inside the http context), so the
# `map` below must live at http level — conf.d includes are exactly there.
#
# Plan-mandated key configuration, all present:
# - map $http_upgrade -> $connection_upgrade (WebSocket hop-by-hop header)
# - listen 8080 (non-privileged port, matches the unprivileged nginx image)
# - root /usr/share/nginx/html + SPA fallback try_files
# - location /api/ proxies to http://manao-backend:8080 keeping the original
#   path (no trailing rewrite), with Host, Upgrade/Connection forwarding,
#   proxy_read_timeout 3600s for long-lived log/terminal WebSockets,
#   proxy_buffering off for streaming responses, proxy_next_upstream off so
#   non-idempotent (write) requests are never retried automatically, and
#   access_log off so one-time WebSocket ticket query strings never reach the
#   proxy access log.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress static text assets on the fly.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/ttf
               font/otf application/wasm;

    # Same-origin API and WebSocket proxy to the backend Service.
    # Covers both REST (/api/v1/...) and the log WebSocket path
    # (/api/v1/ws/run-logs, see src/features/logs/logProtocol.ts).
    location /api/ {
        proxy_pass http://manao-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_next_upstream off;
        access_log off;
    }

    # Hashed static assets: immutable long cache (Vite fingerprints filenames).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # WASM binaries (Monaco etc.) must carry the correct MIME type; a scoped
    # empty types block clears the inherited map and default_type applies.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing: unknown paths fall back to index.html, which must never be
    # cached by browsers so new deploys take effect immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
