spring:
  config:
    activate:
      on-profile: local-cluster
  datasource:
    url: ${MANAO_DB_URL:jdbc:mysql://127.0.0.1:3306/manao_poc4}
    username: ${MANAO_DB_USERNAME:manao}
    password: ${MANAO_DB_PASSWORD:}
server:
  port: 18080
manao:
  poc4:
    backend:
      profile: local-cluster
      kubernetes:
        master-url: ${MANAO_K8S_MASTER_URL:}
        in-cluster: false
        service-account: false
        kubeconfig-file: ${KUBECONFIG:}
    ai:
      enabled: ${MANAO_AI_ENABLED:false}
      project-id: ${MANAO_AI_PROJECT_ID:}
      worker:
        base-url: ${MANAO_AI_WORKER_BASE_URL:}
        token: ${MANAO_AI_WORKER_TOKEN:}
      internal:
        token: ${MANAO_AI_INTERNAL_TOKEN:}
