spring:
  application:
    name: manao-poc4-backend
  profiles:
    default: local-cluster
  datasource:
    url: ${MANAO_DB_URL:jdbc:mysql://127.0.0.1:3306/manao_poc4}
    username: ${MANAO_DB_USERNAME:manao}
    password: ${MANAO_DB_PASSWORD:}
  flyway:
    enabled: false
management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,kubernetes
  endpoints:
    web:
      exposure:
        include: health
manao:
  poc4:
    backend:
      profile: local-cluster
      java-version: ${MANAO_JAVA_VERSION:17}
      maven-version: ${MANAO_MAVEN_VERSION:3.9.11}
      timeout: ${MANAO_TIMEOUT:180s}
      kubernetes:
        master-url: ${MANAO_K8S_MASTER_URL:https://127.0.0.1:6443}
        namespace: ${MANAO_K8S_NAMESPACE:manao}
      workspace:
        bridge-mode: ${MANAO_WORKSPACE_BRIDGE_MODE:rwx-pvc}
        pvc-name: ${MANAO_WORKSPACE_PVC:manao-workspace-rwx}
      logging:
        redact-secrets: true
