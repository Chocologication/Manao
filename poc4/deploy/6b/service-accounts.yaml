# ServiceAccounts for Stage 6B.
# - manao-backend: used by the backend Deployment; token automount stays ENABLED because
#   the in-cluster Fabric8 client reads /var/run/secrets/kubernetes.io/serviceaccount.
#   Its permissions are limited by backend-rbac.yaml (namespace Role + read-only ClusterRole).
# - manao-workspace-agent / manao-maven-runner: referenced by name in the code
#   (WorkspaceResourceFactory.WORKSPACE_SERVICE_ACCOUNT, JobResourceFactory
#   withServiceAccountName("manao-maven-runner")). They carry NO RBAC permissions and
#   disable token automount, matching the 6A posture: workload pods never talk to the API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manao-backend
  namespace: manao-stage6b
  labels:
    app.kubernetes.io/part-of: manao
    app.kubernetes.io/stage: 6b
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manao-workspace-agent
  namespace: manao-stage6b
  labels:
    app.kubernetes.io/part-of: manao
    app.kubernetes.io/stage: 6b
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manao-maven-runner
  namespace: manao-stage6b
  labels:
    app.kubernetes.io/part-of: manao
    app.kubernetes.io/stage: 6b
automountServiceAccountToken: false
