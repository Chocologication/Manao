# Frontend Deployment for Stage 6B (namespace manao-stage6b).
#
# - Serves the production static build (poc4/frontend/Dockerfile) and proxies
#   same-origin /api/ (REST + WebSocket) to the backend Service
#   `backend.manao-stage6b.svc.cluster.local:8080`; the browser therefore talks
#   to a single origin only.
# - replicas: 1, stateless (static files + nginx proxy), so a rolling update is
#   safe here (unlike the backend, which pins Recreate for workspace fencing).
# - Public entry (Stage B decision): the server has no reusable ingress/host
#   port (Task 1 measured all-accept-no-service on 1.12.245.235), so the Service
#   is NodePort 30080 and PUBLIC_ORIGIN is http://1.12.245.235:30080 (HTTP;
#   plaintext transport limitation recorded in acceptance.md). ConfigMap
#   MANAO_WS_EXTRA_ORIGIN must carry that exact origin (see README sections
#   6/8.3).
# - The container image (nginxinc/nginx-unprivileged) runs as uid/gid 101, so
#   runAsNonRoot holds without any extra volume permissions.
# - The image value is NOT baked into this manifest. Substitute the placeholder
#   `manao-poc4-frontend:replace-me` with the digest-pinned reference built in
#   README section 8 before apply (fail-fast placeholder, same convention as
#   backend.yaml). Applying it unmodified leaves the pod in ImagePullBackOff.
# - Readiness/liveness probes hit / (index.html), which nginx serves from the
#   static files; the /api/ proxy path is exercised by the browser during the
#   Stage B public-entry verification, not by a k8s probe.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: manao-stage6b
  labels:
    app.kubernetes.io/name: manao-frontend
    app.kubernetes.io/part-of: manao
    app.kubernetes.io/stage: 6b
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: manao-frontend
    app.kubernetes.io/stage: 6b
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
# ClusterIP alternative — only if the public entry moves back behind an
# existing ingress/host port: change `type: NodePort` to `type: ClusterIP` and
# drop the `nodePort:` line above. After any public-origin change, update the
# ConfigMap `manao-backend-config` key MANAO_WS_EXTRA_ORIGIN with the exact
# origin so WebSocket origin checks accept it (see README sections 6 and 8.3),
# then restart deploy/backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: manao-stage6b
  labels:
    app.kubernetes.io/name: manao-frontend
    app.kubernetes.io/part-of: manao
    app.kubernetes.io/stage: 6b
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: manao-frontend
      app.kubernetes.io/stage: 6b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manao-frontend
        app.kubernetes.io/part-of: manao
        app.kubernetes.io/stage: 6b
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: manao-poc4-frontend:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
